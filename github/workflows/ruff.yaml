name: Ruff (uv)

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    ruff:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install uv
                uses: astral-sh/setup-uv@v4
                with:
                    enable-cache: true

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.13'

            -   name: Install Ruff with uv
                run: |
                    uv tool install ruff
                    ruff --version

            -   name: Ruff check (no fix)
                run: |
                    ruff check .
                    ruff format --check .
